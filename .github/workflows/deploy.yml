name: Deploy Spring Boot to EC2 via GHCR

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente al hacer push a la rama main

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: spring-app-ejemplo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso obligatorio para escribir en GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configurar JDK 21 y la caché automática para Gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 2. Dar permisos de ejecución al Gradle Wrapper y compilar el JAR
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      # 3. Convertir el nombre del repositorio a minúsculas (Requisito obligatorio de GHCR)
      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 4. Autenticarse en GitHub Container Registry (GHCR) usando las variables de GitHub
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Construir y subir la imagen Docker a GHCR con el tag 'latest'
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest

      # 6. Despliegue Automatizado e Idempotente vía SSH
      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # --- APROVISIONAMIENTO IDEMPOTENTE DE SWAP ---
            if [ ! -f /swapfile ]; then
              echo "Instancia sin Swap. Creando 2GB..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            
            # --- APROVISIONAMIENTO IDEMPOTENTE DE DOCKER ---
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Iniciando instalación..."
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user
            fi
            
            # --- EJECUCIÓN SEGURA CON PERMISOS REFRESCADOS ---
            sg docker -c "
              # Autenticar el Docker local del EC2 en GHCR
              echo '${{ secrets.GH_CR_PAT }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
              # Descargar la última versión de la imagen
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            
              # --- PASOS IDEMPOTENTES DEL CONTENEDOR ---
              docker stop ${{ env.CONTAINER_NAME }} || true
              docker rm ${{ env.CONTAINER_NAME }} || true
              docker image prune -f
            
              # --- MAPEO CRUZADO: Puerto 80 del Servidor al 8080 del Contenedor ---
              docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                -p 80:8080 \
                -e PORT=8080 \
                -e PUBLIC_HOST_URL='http://${{ secrets.TARGET_HOST_IP }}' \
                -e API_GATEWAY_SECRET='${{ secrets.API_GATEWAY_SECRET }}' \
                -e DB_URL='jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres' \
                -e DB_USER='${{ secrets.SUPABASE_DB_USER }}' \
                -e DB_PASSWORD='${{ secrets.SUPABASE_DB_PASSWORD }}' \
                -e AWS_REGION='us-east-2' \
                --restart unless-stopped \
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            "